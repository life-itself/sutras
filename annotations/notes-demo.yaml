# Test notes for notes-demo.md: written to try the layout, not Rufus's notes.
# Format: see scripts/notes. Check and rebuild with: scripts/notes notes-demo
text: notes-demo.md
notes:
  - id: demo-1-pick-and-choose
    passage: "1"
    quote: If only you do not pick and choose.
    note: The whole poem is in this line. Everything after it turns the same thought over.
    by: Sutras editors (test)
    date: 2026-11-20

  - id: demo-1-hair
    passage: "1"
    quote: Be off by a hair, And you are as far from it as heaven from earth.
    by: Sutras editors (test)
    date: 2026-11-20

  - id: demo-8-flower
    passage: "8"
    quote: A dream, an illusion, a flower in the sky
    note: A test of a note and a footnote on the same line. Both sit in the margin, the footnote first.
    by: Sutras editors (test)
    date: 2026-11-20

  - id: demo-13-emptiness
    passage: "13"
    quote: is precisely
    prefix: Emptiness
    suffix: existence
    note: "“Is precisely” comes twice in this stanza, so this note gives the words either side to say which one it means. Compare the *Shodoka*, also in this library: [Song of Enlightenment](/shodoka)."
    by: Sutras editors (test)
    date: 2026-11-20

  - id: demo-14-not-two
    passage: "14"
    quote: Faith and mind are not two;
    note: The title of the poem, unfolded in its last stanza but one.
    by: Sutras editors (test)
    date: 2026-11-20

  - id: demo-intro-merge
    quote: the believing mind and the mind which is believed in merge into one
    note: A note on prose rather than verse. With no passage given, the quote must be unique in the whole page.
    by: Sutras editors (test)
    date: 2026-11-20
